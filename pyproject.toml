# PURPOSE: Install the standalone Router and Codex-first MCP service with shipped tables.
# CONTRACT: RT-MCP-BUILD-001; official MCP 1.30.0 and unchanged routing catalog.
# DEPENDS: setuptools build backend; Python 3.12+ and the captured macOS Codex profile.
[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cortados-router"
version = "1.0.0"
description = "Subscription-aware Router with a Codex-first MCP worker service"
requires-python = ">=3.12"
license = "GPL-3.0-only"
dependencies = ["mcp==1.30.0"]

[tool.setuptools]
packages = ["cortados_router", "integrations", "integrations.hermes", "integrations.mcp", "tables"]
include-package-data = false

[tool.setuptools.package-data]
cortados_router = ["cursor_quota.cjs"]
tables = ["*.json", "inventory/*.txt", "benchmarks/*.json", "benchmarks/*.csv", "benchmarks/*.txt", "community/*.jsonl"]
