<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CortadOS Router · usage</title>
<style>
:root { --bg:#f6f7f9; --card:#fff; --fg:#1b1f24; --muted:#6a737d; --line:#e1e4e8; --bar:#2f7de1; --low:#d9822b; --bad:#d73a49; }
@media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#181b21; --fg:#e6e8eb; --muted:#8b949e; --line:#2a2f37; --bar:#4c9aff; --low:#e3a04f; --bad:#f06b78; } }
* { box-sizing: border-box; }
body { margin:0; font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background:var(--bg); color:var(--fg); }
header { display:flex; align-items:center; gap:12px; padding:14px 22px; border-bottom:1px solid var(--line); }
header h1 { font-size:17px; margin:0; }
#status { color:var(--muted); margin-left:auto; }
button { font:inherit; padding:4px 10px; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:6px; cursor:pointer; }
main { padding:18px 22px; max-width:1400px; margin:0 auto; }
h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:22px 0 8px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:12px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
.card.stale { opacity:.55; }
.title { font-weight:600; }
.sub { color:var(--muted); font-size:12px; }
.bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin:6px 0; }
.bar > div { height:100%; background:var(--bar); }
.bar.low > div { background:var(--low); } .bar.bad > div { background:var(--bad); }
.big { font-size:22px; font-weight:600; }
table { width:100%; border-collapse:collapse; }
td, th { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
th { color:var(--muted); font-weight:500; font-size:12px; }
td.num { text-align:right; font-variant-numeric:tabular-nums; width:60px; }
td.barcell { width:40%; }
.cols { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:12px; }
ul { margin:0; padding-left:18px; } .err { color:var(--bad); }
#login { max-width:360px; margin:80px auto; }
#login input { width:100%; padding:7px; margin:8px 0; font:inherit; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
</style>
</head>
<body>
<header><h1>CortadOS Router · usage</h1><span id="status"></span><button id="logout" hidden>Forget token</button></header>
<form id="login" class="card" hidden>
  <div class="title">Provider token</div>
  <div class="sub">Kept in this tab's sessionStorage only; sent as a Bearer header to /v1/cortados/usage.</div>
  <input id="tok" type="password" autocomplete="off" required>
  <button type="submit">Open dashboard</button>
</form>
<main id="main" hidden></main>
<script>
"use strict";
const KEY = "cortados-usage-token", URL_ = "/v1/cortados/usage", EVERY = 30000;
const $ = (id) => document.getElementById(id);
let timer = null;
function getTok() { try { return sessionStorage.getItem(KEY) || ""; } catch (e) { return ""; } }
function setTok(t) { try { if (t) sessionStorage.setItem(KEY, t); else sessionStorage.removeItem(KEY); } catch (e) {} }
// Every string from the endpoint goes in through textContent: lane names and errors are data, never markup.
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined && text !== null) e.textContent = String(text); return e; }
function add(parent, ...kids) { for (const k of kids) if (k) parent.appendChild(k); return parent; }
function age(s) { if (s === null || s === undefined || isNaN(s)) return "?"; s = Math.round(s); if (s < 90) return s + " s"; if (s < 5400) return Math.round(s / 60) + " min"; if (s < 172800) return Math.round(s / 3600) + " h"; return Math.round(s / 86400) + " d"; }
function pct(v) { return (typeof v === "number") ? Math.round(v) + "%" : "–"; }
function bar(v) { const b = el("div", "bar"); const f = el("div"); const p = Math.max(0, Math.min(100, Number(v) || 0)); f.style.width = p + "%"; if (p < 10) b.classList.add("bad"); else if (p < 30) b.classList.add("low"); return add(b, f); }
function section(title) { return el("h2", null, title); }
function table(rows, cols, maxOf) {
  const t = el("table"), head = el("tr");
  cols.forEach(c => add(head, el("th", null, c.h)));
  add(t, head);
  const max = Math.max(1, ...rows.map(maxOf || (() => 0)));
  if (!rows.length) { const tr = el("tr"); const td = el("td", "sub", "none"); td.colSpan = cols.length; add(t, add(tr, td)); }
  rows.forEach(r => { const tr = el("tr"); cols.forEach(c => {
    if (c.bar) { const td = el("td", "barcell"); const b = el("div", "bar"); const f = el("div"); f.style.width = (100 * (Number(c.bar(r)) || 0) / max) + "%"; add(tr, add(td, add(b, f))); }
    else add(tr, el("td", c.num ? "num" : null, c.v(r)));
  }); add(t, tr); });
  return t;
}
function card(title, sub) { const c = el("div", "card"); add(c, el("div", "title", title)); if (sub) add(c, el("div", "sub", sub)); return c; }
function countTable(obj, label) { const rows = Object.entries(obj || {}).sort((a, b) => b[1] - a[1]);
  return table(rows, [{h: label, v: r => r[0]}, {h: "", bar: r => r[1]}, {h: "n", num: true, v: r => r[1]}], r => r[1]); }

function render(d) {
  const m = $("main"); m.replaceChildren();
  add(m, section("Resources (% left)"));
  const lanes = el("div", "grid");
  (d.lanes || []).forEach(l => {
    let sub = l.account ? "account " + l.account : "";
    if (l.shared_with && l.shared_with.length) sub = (sub ? sub + " · " : "") + "shared with " + l.shared_with.join(", ");
    const c = card(l.label || l.lane, sub);
    if (l.stale) c.classList.add("stale");
    add(c, el("div", "big", pct(l.left_pct)), bar(l.left_pct));
    (l.windows || []).forEach(w => { const left = (typeof w.headroom_pct === "number") ? w.headroom_pct : w.left_pct;
      add(c, el("div", "sub", (w.window || "window") + ": " + pct(left) + " left" + (w.resets_at ? " · resets " + w.resets_at : ""))); });
    add(c, el("div", "sub", "sample " + age(l.sample_age_s) + " old" + (l.stale ? " (stale)" : "")));
    if (l.error) add(c, el("div", "sub err", l.error_kind || l.error));
    add(lanes, c);
  });
  if (!(d.lanes || []).length) add(lanes, el("div", "sub", "no lane readings"));
  add(m, lanes);
  const r = d.routed || {};
  add(m, section("Routed calls"));
  const cols = el("div", "cols");
  const lm = [{h: "lane", v: x => x.lane}, {h: "model", v: x => x.model}, {h: "", bar: x => x.calls}, {h: "calls", num: true, v: x => x.calls}];
  add(cols, add(card("Today"), table(r.today || [], lm, x => x.calls)));
  add(cols, add(card("Last 7 days"), table(r.last_7d || [], lm, x => x.calls)));
  add(cols, add(card("Top S1 bands (7 d)"), table(r.top_bands_7d || [], [{h: "band", v: x => x.band}, {h: "", bar: x => x.calls}, {h: "calls", num: true, v: x => x.calls}], x => x.calls)));
  add(cols, add(card("This provider since start"), countTable(r.provider_since_start, "lane/model")));
  add(m, cols);
  add(m, section("Refusals, child tasks, S1"));
  const h = el("div", "cols");
  const rf = d.refusals || {};
  add(h, add(card("Refusals (24 h)", "total " + (rf.total || 0)), countTable(rf.by_reason, "reason")));
  const ct = d.child_tasks || {};
  add(h, add(card("Child tasks (7 d)", ct.truncated ? "log tail clipped" : ""), countTable(ct.by_status, "status"), countTable(ct.by_event, "event")));
  const s1 = d.s1 || {};
  const s1c = card("S1 scorer", s1.status || "");
  add(s1c, el("div", "big" + (s1.available ? "" : " err"), s1.available ? "up" : "down"));
  if (typeof s1.latency_ms === "number") add(s1c, el("div", "sub", "latency " + Math.round(s1.latency_ms) + " ms"));
  add(h, s1c);
  add(m, h);
  add(m, section("Hardware"));
  const hw = el("div", "grid");
  (d.hardware || []).forEach(x => { const v = x.data || {};
    const c = card(v.host || x.file, v.chip || "");
    if (typeof v.cpu_busy_pct === "number") add(c, el("div", "sub", "CPU busy " + pct(v.cpu_busy_pct)), bar(v.cpu_busy_pct));
    if (typeof v.gpu_busy_pct === "number") add(c, el("div", "sub", "GPU busy " + pct(v.gpu_busy_pct)), bar(v.gpu_busy_pct));
    Object.keys(v).filter(k => k.indexOf("mem_") === 0).forEach(k => add(c, el("div", "sub", k.slice(4).replace(/_/g, " ") + ": " + v[k])));
    if (v.headroom !== undefined) add(c, el("div", "sub", "headroom: " + (typeof v.headroom === "object" ? JSON.stringify(v.headroom) : v.headroom)));
    const om = v.ollama_models || [];
    add(c, el("div", "sub", "Ollama: " + (om.length ? om.map(o => (typeof o === "object" ? (o.name || o.model || JSON.stringify(o)) : o)).join(", ") : "none resident")));
    add(c, el("div", "sub", "sample " + age(x.age_s) + " old"));
    add(hw, c);
  });
  if (!(d.hardware || []).length) add(hw, el("div", "sub", "no hardware samples"));
  add(m, hw);
  add(m, section("Notes and errors"));
  const ne = el("div", "cols");
  const notes = el("ul"); (d.notes || []).forEach(n => add(notes, el("li", null, typeof n === "string" ? n : JSON.stringify(n))));
  const errs = el("ul"); (d.errors || []).forEach(e => add(errs, el("li", "err", typeof e === "string" ? e : ((e.source || "?") + ": " + (e.error || JSON.stringify(e))))));
  add(ne, add(card("Notes"), notes), add(card("Errors"), errs));
  add(m, ne);
  $("status").textContent = "updated " + new Date().toLocaleTimeString() + (d.generated_at ? " · generated " + d.generated_at : "");
}

function showLogin(msg) {
  if (timer) { clearInterval(timer); timer = null; }
  $("main").hidden = true; $("logout").hidden = true; $("login").hidden = false;
  $("status").textContent = msg || ""; $("tok").value = ""; $("tok").focus();
}
async function refresh() {
  const t = getTok(); if (!t) return showLogin();
  try {
    const res = await fetch(URL_, {headers: {"Authorization": "Bearer " + t}, cache: "no-store", credentials: "omit"});
    if (res.status === 401) { setTok(""); return showLogin("Token refused; enter it again."); }
    if (!res.ok) { $("status").textContent = "error " + res.status; return; }
    render(await res.json());
  } catch (e) { $("status").textContent = "fetch failed: " + (e && e.message ? e.message : e); }
}
function start() { $("login").hidden = true; $("main").hidden = false; $("logout").hidden = false; refresh(); if (!timer) timer = setInterval(refresh, EVERY); }
$("login").addEventListener("submit", (ev) => { ev.preventDefault(); const t = $("tok").value.trim(); if (!t) return; setTok(t); start(); });
$("logout").addEventListener("click", () => { setTok(""); showLogin("Token forgotten."); });
if (getTok()) start(); else showLogin();
</script>
</body>
</html>
