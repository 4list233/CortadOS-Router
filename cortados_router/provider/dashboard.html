<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CortadOS Router</title>
<style>
  :root { --bg:#fff; --fg:#111; --mut:#666; --card:#f6f6f7; --line:#e3e3e6; --ok:#1a7f37; --warn:#b35900; --bad:#b00020; --accent:#3257d6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --fg:#e8e8ea; --mut:#9aa0a6; --card:#181b20; --line:#2a2e35; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --accent:#6b8afd; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; padding:16px; border-bottom:1px solid var(--line); }
  h1 { font-size:18px; margin:0; }
  .mut { color:var(--mut); }
  main { padding:16px; max-width:1100px; margin:0 auto; }
  section { margin-bottom:22px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--mut); margin:0 0 10px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .card h3 { margin:0 0 6px; font-size:14px; }
  .row { display:flex; justify-content:space-between; gap:8px; }
  .chip { display:inline-block; padding:2px 8px; border-radius:999px; background:var(--card); border:1px solid var(--line); font-size:12px; margin:2px 4px 2px 0; }
  .chip.ok{color:var(--ok);} .chip.warn{color:var(--warn);} .chip.bad{color:var(--bad);}
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--mut); font-weight:600; }
  .big { font-size:26px; font-weight:600; }
  button,input { font:inherit; padding:7px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  button { cursor:pointer; }
  #err { color:var(--bad); padding:0 16px; }
  #gate { padding:16px; }
  .fit { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>CortadOS Router</h1>
  <span class="mut" id="sub">resource pool</span>
  <span style="margin-left:auto"></span>
  <span class="mut" id="stamp"></span>
  <button id="refresh">Refresh</button>
</header>
<div id="err"></div>
<div id="gate" hidden>
  <p>Enter the provider token to load the dashboard.</p>
  <input id="token" type="password" size="40" placeholder="CORTADOS_PROVIDER_TOKEN" autocomplete="off">
  <button id="save">Load</button>
</div>
<main id="main" hidden></main>

<script>
"use strict";
const $ = s => document.querySelector(s);
const TKEY = "cortados.providerToken";
let timer = null;

function gib(b) { return (b === null || b === undefined) ? "—" : (b / (2 ** 30)).toFixed(1) + " GiB"; }
function pct(n) { return (n === null || n === undefined) ? "—" : Math.round(n) + "%"; }
function esc(s) { const d = document.createElement("div"); d.textContent = (s === null || s === undefined) ? "" : String(s); return d.innerHTML; }

function token() { try { return localStorage.getItem(TKEY) || ""; } catch (e) { return ""; } }
function setToken(t) { try { localStorage.setItem(TKEY, t); } catch (e) {} }

async function load() {
  const t = token();
  if (!t) { $("#gate").hidden = false; $("#main").hidden = true; return; }
  try {
    const r = await fetch("/resources", { headers: { "authorization": "Bearer " + t } });
    if (r.status === 401) { $("#err").textContent = "Token rejected. Enter it again."; $("#gate").hidden = false; $("#main").hidden = true; return; }
    if (!r.ok) throw new Error("HTTP " + r.status);
    const snap = await r.json();
    $("#err").textContent = "";
    $("#gate").hidden = true; $("#main").hidden = false;
    render(snap);
    $("#stamp").textContent = "updated " + new Date().toLocaleTimeString();
  } catch (e) {
    $("#err").textContent = "Could not reach the provider (" + e.message + ").";
  }
}

function render(s) {
  const u = s.usage || {}, subs = s.subscriptions || {}, dev = s.devices || {};
  const lat = u.s1_latency_ms || {};
  const deg = u.degraded || {};
  const bands = Object.entries(u.by_band || {}).map(([b, n]) => `<span class="chip">${esc(b)} · ${n}</span>`).join("") || "—";
  const lanes = Object.entries(u.by_lane || {}).sort((a, b) => b[1] - a[1]).map(([l, n]) => `<span class="chip">${esc(l)} · ${n}</span>`).join("") || "—";
  const recent = (u.recent || []).map(r => `<tr><td>${new Date((r.ts||0)*1000).toLocaleTimeString()}</td><td>${esc(r.band)}</td><td>${esc(r.lane)}/${esc(r.model)}</td><td>${r.degraded ? '<span class="chip bad">degraded</span>' : ''}</td><td class="mut">${r.response_chars ?? "—"} ch</td></tr>`).join("");

  const subCards = Object.entries(subs).filter(([k]) => k !== "error").map(([lane, h]) => {
    const w = h.tightest || {};
    const cls = h.ok === false ? "bad" : (h.expiring_pct > 10 ? "warn" : "ok");
    return `<div class="card"><h3>${esc(lane)}</h3>
      <div class="row"><span class="mut">scarcity</span><span>${h.scarcity ?? "—"}</span></div>
      <div class="row"><span class="mut">expiring</span><span class="${h.expiring_pct>10?'fit':''}">${pct(h.expiring_pct)}</span></div>
      ${w.window ? `<div class="row"><span class="mut">${esc(w.window)}</span><span>${pct(w.used_pct)} used / ${pct(w.elapsed_pct)} elapsed</span></div>` : ""}
      ${w.resets_at ? `<div class="row"><span class="mut">resets</span><span>${esc(w.resets_at)}</span></div>` : ""}
      <span class="chip ${cls}">${h.ok === false ? "spent" : "ok"}</span></div>`;
  }).join("") || '<p class="mut">No subscription readings cached yet.</p>';

  let devHtml;
  if (dev.status === "ok") {
    devHtml = (dev.nodes || []).map(n => `<div class="card"><h3>${esc(n.id)} <span class="mut">${esc(n.role)||""}</span></h3>
      <div class="row"><span class="mut">status</span><span class="${n.status==='online'?'fit':''}">${esc(n.status)}</span></div>
      <div class="row"><span class="mut">GPU headroom</span><span>${gib(n.gpu_headroom_estimate_bytes)}</span></div>
      <div class="row"><span class="mut">GPU util</span><span>${pct(n.gpu_utilization_pct)}</span></div>
      <div>${(n.fits||[]).map(m=>`<span class="chip fit">${esc(m)}</span>`).join("") || '<span class="mut">nothing fits</span>'}</div></div>`).join("")
      + `<div class="card"><h3>pool</h3><div class="row"><span class="mut">headroom</span><span>${gib(dev.pool_headroom_estimate_bytes)}</span></div>
         <div>${(dev.pool_fits||[]).map(m=>`<span class="chip fit">${esc(m)}</span>`).join("") || '<span class="mut">—</span>'}</div></div>`;
  } else {
    devHtml = `<p class="mut">Devices ${esc(dev.status)}${dev.error ? ": " + esc(dev.error) : ""}. Set CORTADOS_LOCAL_RESOURCES_CONFIG on the provider to meter local compute.</p>`;
  }

  $("#main").innerHTML = `
    <section><h2>Usage</h2>
      <div class="grid">
        <div class="card"><div class="mut">routes logged</div><div class="big">${u.total_routes ?? "—"}</div></div>
        <div class="card"><div class="mut">degraded</div><div class="big ${deg.count?'':''}">${deg.count ?? 0}<span class="mut" style="font-size:14px"> / ${deg.of ?? 0}</span></div></div>
        <div class="card"><div class="mut">S1 latency</div><div class="big">${lat.median ?? "—"}<span class="mut" style="font-size:14px"> ms median</span></div><div class="mut">p90 ${lat.p90 ?? "—"} ms${lat.window?` · last ${lat.window}`:""}</div></div>
      </div>
      <p>${bands}</p><p>${lanes}</p>
      ${recent ? `<table><thead><tr><th>time</th><th>band</th><th>route</th><th></th><th>size</th></tr></thead><tbody>${recent}</tbody></table>` : ""}
    </section>
    <section><h2>Subscriptions</h2><div class="grid">${subCards}</div></section>
    <section><h2>Devices &amp; model fit <span class="mut" style="text-transform:none">(estimate — weights only, not an admission promise)</span></h2><div class="grid">${devHtml}</div></section>`;
}

$("#save").addEventListener("click", () => { const v = $("#token").value.trim(); if (v) { setToken(v); $("#token").value = ""; load(); } });
$("#refresh").addEventListener("click", load);
load();
timer = setInterval(load, 20000);
</script>
</body>
</html>
